version: "3.9"

x-env: &common-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks?sslmode=disable
  REDIS_ADDR: redis:6379

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    # Dockerfile sets ENTRYPOINT ["/server"]; `command:` supplies ENTRYPOINT's *arguments*, not a
    # replacement for it (that's `entrypoint:`, used below for mock-receiver). Repeating "/server"
    # here used to make the actual argv `/server /server --mode=X`, which Go's flag package parses
    # by stopping at the first non-flag token ("/server") — silently discarding --mode and leaving
    # every service defaulted to --mode=all. Confirmed via `docker top`; fixed by dropping the
    # binary name so command: is just the flags.
    command: ["--mode=api"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
    environment: *common-env

  dispatcher:
    build: .
    command: ["--mode=dispatcher"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment: *common-env

  worker:
    build: .
    command: ["--mode=worker"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      <<: *common-env
      WORKER_COUNT: "4"
    # scale with: docker compose up --scale worker=3

  scheduler:
    build: .
    command: ["--mode=scheduler"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment: *common-env

  mock-receiver:
    build: .
    entrypoint: ["/mock-receiver"]
    environment:
      FAIL_COUNT: "0"
      PORT: "9090"
    ports: ["9090:9090"]

volumes:
  pgdata:
